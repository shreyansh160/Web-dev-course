<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Pure CSS Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f5f9;
            font-family: sans-serif;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* 1. The outer viewing window (clips overflowing images) */
        .slider-frame {
            width: 500px;
            height: 300px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* 2. The inner track holding 3 slides in a row */
        .slide-track {
            display: flex;
            width: 300%; /* 3 images = 300% total width */
            height: 100%;
            animation: slideAnimation 9s infinite ease-in-out;
        }

        /* 3. Each individual slide */
        .slide {
            width: 100%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 4. Animation timeline: Pauses on each image, then transitions */
        @keyframes slideAnimation {
            0%, 25% {
                transform: translateX(0%);      /* Show Image 1 */
            }
            33%, 58% {
                transform: translateX(-33.33%); /* Slide to Image 2 */
            }
            66%, 91% {
                transform: translateX(-66.66%); /* Slide to Image 3 */
            }
            100% {
                transform: translateX(0%);      /* Reset back to Image 1 */
            }
        }
    </style>
</head>
<body>
    <h2>CSS-Only Automatic Slider</h2>

    <div class="slider-frame">
        <div class="slide-track">
            <div class="slide">
                <img src="https://picsum.photos/id/1015/500/300" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/1016/500/300" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/1018/500/300" alt="Slide 3">
            </div>
        </div>
    </div>
</body>
</html>
