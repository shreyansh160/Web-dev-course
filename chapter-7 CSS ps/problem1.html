<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: aqua;
            padding: 15px 30px;
        }
        nav ul{
            display: grid;
            grid-template-columns: repeat(3, auto);
            justify-content: center;
            gap: 45px;
            list-style: none;
        }
        nav ul li{
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
            </ul>
        </nav>
    </header>
</body>
</html>
