<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin: 100px;
        }
        .box1{
            height: 150px;
            width: 150px;
            background-color: red;
            position: relative;
            z-index: 2;
        }
        .box2{
            height: 150px;
            width: 150px;
            background-color: blue;
            position: relative;
            top: -60px;
            left: 50px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
    </div>
</body>
</html>
