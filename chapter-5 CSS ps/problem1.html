<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: brown;
            font-family: sans-serif;
            height: 200vh;
        }
        header{
            width: 100%;
            background-color: red;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
        }
        nav ul{
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
        }
        nav ul li{
            list-style: square;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact Us</li>
            </ul>
        </nav>
    </header>
</body>
</html>
