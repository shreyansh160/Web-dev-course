<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5];
        let num;
        do{
            let input= prompt("Enter a number (enter 0 to stop):");
            num = Number.parseInt(input);
            arr.push(num);
        }while (num !== 0);

        console.log("Final Array:", arr);
    </script>
</body>
</html>
