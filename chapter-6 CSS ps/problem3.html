<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            min-height: 80vh;
            border: 2px solid black;
            background-color: chartreuse;
        }

        header {
            padding: 10px auto;
            background-color: brown;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 45px;
            justify-content: center;
            align-items: center;
        }

        nav ul li {
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

         .content-area{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
         }

        .box1 {
            height: 150px;
            width: 150px;
            border: 2px solid black;
            background-color: aquamarine;
        }

        .box2 {
            height: 150px;
            width: 150px;
            border: 2px solid black;
            float: right;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
            </nav>
        </header>
        <div class="content-area">
            <div class="box1">Box 1</div>
            <div class="box2">Box 2</div>
        </div>
    </div>
</body>

</html>
