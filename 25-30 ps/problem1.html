<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            min-height: 200vh;
        }
        header{
            position: sticky;
            top: 0;
            background-color: blue;
            color: white;
            padding: 5px;
        }
        .card{
            position: relative;
            border: 2px solid black;
            margin: 40px auto;
            width: 300px;
            height: 150px;
            padding: 20px;
        }
        button{
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            border-radius: 7px;
            background-color: lightblue;
            color: darkblue;
            font-weight: bold;
        }
        .badge{
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: crimson;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
    </style>
</head>
<body>
    <header>
        <h2>My Portfolio Websites</h2>
    </header>
    <div class="card">
        <span class="badge">PRO</span>
        <h3>Course Title</h3>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dignissimos, cum.</p>
    </div>
    <button type="btn">Help</button>
</body>
</html>
