<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let runAgain=true;
        while(runAgain){
        let a = prompt("Enter your age");
        a = parseInt(a);

        if(a<0){
            alert("Please enter a valid age(age cannot be negative).");
        }
        else if(a>=18){
            alert("You can drive");
        }else{
            alert("You cannot drive");
        }
        
        runAgain= confirm("Do you want to see the promt again?");
    }
    </script>
</body>
</html>
