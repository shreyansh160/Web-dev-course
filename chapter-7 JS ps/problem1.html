<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav id="navbar">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Serices</li>
            <li>Contacts</li>
        </ul>
    </nav>

    <script>
        let list= document.querySelector("#navbar ul");
        list.firstElementChild.style.color="red";

        let allLi=document.querySelectorAll("li");
        allLi.forEach((li)=>{
            li.style.backgroundColor="cyan";
        });
    </script>
</body>
</html>
